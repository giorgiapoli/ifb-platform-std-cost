name: Discover BC Entities

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Discover entities
        env:
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
        run: python scripts/discover_entities.py
