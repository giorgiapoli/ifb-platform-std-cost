name: Update BC Data (HK)

on:
  schedule:
    - cron: '0 5 * * *'   # Ogni giorno alle 07:00 ora italiana (05:00 UTC)
  workflow_dispatch:        # Trigger manuale dal tab Actions su GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Update HK XRef
        env:
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
        run: python scripts/update_hk_xref.py

      - name: Update HK SC Attuali
        env:
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
        run: python scripts/update_hk_sc.py

      - name: Update HK Anagrafica
        env:
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
        run: python scripts/update_hk_anagrafica.py

      - name: Update IFB Fatture (Italia)
        env:
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
        run: python scripts/update_ifb_fatture.py

      - name: Commit and push JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/hk_xref.json docs/data/hk_sc.json docs/data/hk_anagrafica.json docs/data/ifb_fatture.json
          git diff --cached --quiet && echo "Nessuna modifica" || \
            git commit -m "Auto-update BC data $(date +'%Y-%m-%d')" && git push
