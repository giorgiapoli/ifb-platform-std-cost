name: Update BC Data (HK + MAC)

on:
  schedule:
    - cron: '0 5 * * 1-5'  # Ogni giorno lavorativo alle 07:00 ora italiana (05:00 UTC)
  workflow_dispatch:        # Trigger manuale dal tab Actions su GitHub

concurrency:
  group: update-bc-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Update HK XRef
        env:
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
        run: python scripts/update_hk_xref.py

      - name: Update HK SC Attuali
        env:
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
        run: python scripts/update_hk_sc.py

      - name: Update HK Anagrafica
        env:
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
        run: python scripts/update_hk_anagrafica.py

      - name: Update IFB Fatture (Italia)
        env:
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
        run: python scripts/update_ifb_fatture.py

      - name: Update IFB Listini (Italia)
        env:
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
        run: python scripts/update_ifb_listini.py

      - name: Update MAC Anagrafica (HOFF Macau)
        env:
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
        run: python scripts/update_mac_anagrafica.py

      - name: Update MAC Fatture (BrightView → Macao)
        env:
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
        run: python scripts/update_mac_fatture.py

      - name: Commit and push JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/hk_xref.json docs/data/hk_sc.json docs/data/hk_anagrafica.json docs/data/ifb_fatture.json docs/data/ifb_listini.json docs/data/ifb_listini_HK.json docs/data/ifb_listini_CAN.json docs/data/ifb_listini_MAC.json docs/data/mac_anagrafica.json docs/data/mac_fatture.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update BC data $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          else
            echo "Nessuna modifica"
          fi

      - name: Publish docs/ to gh-pages
        run: |
          cd docs
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish data $(date +'%Y-%m-%d %H:%M')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

